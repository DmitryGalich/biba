events {
    worker_connections 1024;
}

http {
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    server {
        # Passes the original Host header from the client to the proxied server
        proxy_set_header Host $host;
        # Passes the real IP address of the client to the proxied server
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the client's IP to the chain of proxies in the X-Forwarded-For header
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passes the original request protocol (http or https) to the proxied server
        proxy_set_header X-Forwarded-Proto $scheme;

        listen 80;

        location /gateway_test {
            return 200 "gateway_test";
        }

        location /auth/ {
            # Sets HTTP version 1.1 for proxying (required for WebSockets support)
            proxy_http_version 1.1;
            # Passes the Upgrade header from the client to support protocol switching
            proxy_set_header Upgrade $http_upgrade;
            # Explicitly sets the Connection header to "upgrade" to maintain WebSockets
            proxy_set_header Connection "upgrade";
            
            proxy_pass http://keycloak:8080; 
            
            # Informs the proxied server about the original host requested by the client
            proxy_set_header X-Forwarded-Host $host;
            # Informs the proxied server about the original port number used by the client
            proxy_set_header X-Forwarded-Port $server_port;
            # Explicitly passes the protocol (HTTP/HTTPS) to ensure Keycloak generates correct URLs
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        } 
    }
}
