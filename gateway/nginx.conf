events {
    worker_connections 1024;
}

http {
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    server {
        # Passes the original Host header from the client to the proxied server
        proxy_set_header Host $host;
        # Passes the real IP address of the client to the proxied server
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the client's IP to the chain of proxies in the X-Forwarded-For header
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passes the original request protocol (http or https) to the proxied server
        proxy_set_header X-Forwarded-Proto $scheme;

        listen 80;

        location /gateway_test {
            return 200 "gateway_test";
        }

        location /api/ {
            proxy_pass http://backend:8000/;
        }

        location / {
            return 404;
        } 
    }
}
