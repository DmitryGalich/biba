events {
    worker_connections 1024;
}

http {
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Общие заголовки для всех проксируемых сервисов
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Увеличиваем буферы, чтобы Nginx не падал с 502 на длинных токенах/куках Keycloak
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    server {
        listen 80;
        server_name _;

        location = /gateway_test {
            return 200 "gateway_test";
        }

        # Проксирование Keycloak (ожидается KC_HTTP_RELATIVE_PATH=/auth в настройках Keycloak)
        location /auth/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Без слэша на конце — передаем путь /auth/... как есть
            proxy_pass http://keycloak:8080;
        }

        # Проксирование Rust-бэкенда (срез префикса /api/)
        location /api/ {
            # Явно гарантируем передачу токена авторизации
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # Со слэшем на конце — /api/profile превратится в /profile для Axum
            proxy_pass http://backend:8000/;
        }

        location / {
            return 404;
        }
    }
}
