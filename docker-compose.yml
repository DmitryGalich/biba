services:
    gateway:
      image: nginx:1.27 
      container_name: gateway
      volumes:
        - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./gateway/logs:/var/log/nginx 
      ports:
        - "80:80"
      restart: unless-stopped
      networks:
        - internal_network

networks:
  internal_network:
