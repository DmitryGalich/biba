services:
  gateway:
    image: nginx:1.27 
    container_name: gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/logs:/var/log/nginx 
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - internal_network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      # dockerfile: Dockerfile.prod
      dockerfile: Dockerfile.dev

    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - internal_network

networks:
  internal_network:
